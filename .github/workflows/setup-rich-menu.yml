# LINEのリッチメニュー（2ページ）を、本番サイトの画像（public/liff/richmenu-main.png /
# richmenu-sub.png）で登録し直す。管理画面（/admin → 公式LINE → リッチメニュー）の
# 「この内容で作り直す」と同じ処理を、/api/line-admin に CRON_SECRET で頼む。
# 予約・TTGYM教科書・TEAM TOP・キックボクシング体験のリンクは、管理画面で前回登録したものを使う。
#
# 画像やリンク先を変えて本番に反映されたあと、「Run workflow」で実行する。
# リポジトリの Secrets の CRON_SECRET（週刊レシピの予備送信と同じもの）を使う。

name: Set up LINE rich menu

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Register rich menus
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -sS --max-time 90 -o body.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" \
            -d '{"action":"richmenu"}' "https://t-tgym-app.vercel.app/api/line-admin" || true)
          echo "HTTP $status"
          cat body.json; echo
          if [ "$status" = "200" ]; then
            echo "::notice title=rich-menu::HTTP $status $(head -c 900 body.json | tr '\n' ' ')"
          else
            echo "::error title=rich-menu::HTTP $status $(head -c 900 body.json | tr '\n' ' ')"
            exit 1
          fi
